[project]
name = "cloakbrowser-agent"
version = "0.0.1"
description = "Goal-driven browser agent on CloakBrowser, decisions by TypeSafe Jev."
license = "MIT"
requires-python = ">=3.10"
# Pinned: uses cloakbrowser humanize internals (see cloak_agent/browser.py docstring).
dependencies = ["cloakbrowser==0.5.11", "httpx>=0.27,<1", "mcp>=2.2,<3"]

[project.scripts]
cloak-agent = "cloak_agent.cli:main"
cloak-agent-mcp = "cloak_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloak_agent"]

[tool.ruff]
line-length = 120
