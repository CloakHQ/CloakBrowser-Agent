[project]
name = "cloakbrowser-agent"
version = "0.1.3"
description = "Jev-powered stealth browser agent: TypeSafe Jev decides each step, CloakBrowser carries it out. MCP server, CLI and Python API."
readme = "README.md"
keywords = ["jev", "typesafe", "system-one", "browser-agent", "ai-agent", "web-agent", "mcp", "mcp-server",
            "model-context-protocol", "stealth-browser", "browser-automation", "playwright", "chromium", "cloakbrowser"]
license = "MIT"
requires-python = ">=3.10"
# Pinned: uses cloakbrowser humanize internals (see cloak_agent/browser.py docstring).
dependencies = ["cloakbrowser[geoip]==0.5.11", "httpx>=0.27,<1", "mcp>=2.2,<3"]

[project.scripts]
cloak-agent = "cloak_agent.cli:main"
cloak-agent-mcp = "cloak_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloak_agent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit, so local and CI ruff versions (whose defaults differ) check the same rules.
select = ["E4", "E7", "E9", "F"]
